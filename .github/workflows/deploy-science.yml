name: Deploy Science to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.repository == 'nd-science/nd-science.github.io' || github.repository == 'nd-science/ndscience.github.io' || github.repository_owner == 'nd-science'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification checks
        run: pnpm check

      - name: Build Science application
        env:
          PUBLIC_SITE_STATUS: draft
          PUBLIC_SITE_URL: https://nd-science.github.io
          PUBLIC_WELLNESS_SITE_URL: https://wellnessnd.github.io
        run: pnpm --filter @natali/science build

      - name: Restore previous hashed assets from cache
        uses: actions/cache/restore@v4
        with:
          path: .astro-asset-cache-science
          key: astro-assets-science-${{ github.sha }}
          restore-keys: |
            astro-assets-science-

      - name: Preserve previous hashed assets to prevent 404 during HTML cache TTL
        run: |
          mkdir -p .astro-asset-cache-science
          if [ -d ".astro-asset-cache-science" ] && [ "$(ls -A .astro-asset-cache-science 2>/dev/null)" ]; then
            mkdir -p apps/science/dist/_astro
            cp -n .astro-asset-cache-science/* apps/science/dist/_astro/ 2>/dev/null || true
          fi
          if [ -d "apps/science/dist/_astro" ]; then
            cp -r apps/science/dist/_astro/* .astro-asset-cache-science/ 2>/dev/null || true
          fi

      - name: Save updated assets cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .astro-asset-cache-science
          key: astro-assets-science-${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/science/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
